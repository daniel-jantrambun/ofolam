<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17252B" /><!-- keep in sync with colors.secondary -->
    <meta name="description" content="Ofolam turns a Strava activity into a shareable visual: story, post or sticker." />
    <link rel="canonical" href="https://ofolam.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ofolam" />
    <meta property="og:url" content="https://ofolam.com/" />
    <meta property="og:title" content="Ofolam – Turn a Strava activity into a shareable visual" />
    <meta property="og:description" content="Ofolam turns a Strava activity into a shareable visual: story, post or sticker." />
    <!-- Share previews need an absolute URL and a PNG/JPG (SVG is not supported by scrapers) -->
    <meta property="og:image" content="https://ofolam.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://ofolam.com/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/ofolam.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ofolam" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Ofolam – Turn a Strava activity into a shareable visual</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ofolam",
        "url": "https://ofolam.com/",
        "description": "Ofolam turns a Strava activity into a shareable visual: story, post or sticker.",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any"
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme
      var theme = null;
      try {
        theme = localStorage.getItem("ofolam.theme");
      } catch {}
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
