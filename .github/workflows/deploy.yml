name: Deploy

# Pull requests towards main are checked (lint + build) but never deployed.
# A push to main (i.e. a merged pull request) deploys to Cloudflare.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One deploy at a time; a newer push cancels a pending one
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          VITE_COFFEE_URL: ${{ vars.VITE_COFFEE_URL }}
          VITE_TILES_LIGHT: ${{ vars.VITE_TILES_LIGHT }}
          VITE_TILES_DARK: ${{ vars.VITE_TILES_DARK }}
          VITE_TILES_ATTRIBUTION: ${{ vars.VITE_TILES_ATTRIBUTION }}

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `pnpm run deploy` = pnpm build + wrangler deploy
      - name: Build & deploy worker
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_COFFEE_URL: ${{ vars.VITE_COFFEE_URL }}
          VITE_TILES_LIGHT: ${{ vars.VITE_TILES_LIGHT }}
          VITE_TILES_DARK: ${{ vars.VITE_TILES_DARK }}
          VITE_TILES_ATTRIBUTION: ${{ vars.VITE_TILES_ATTRIBUTION }}
